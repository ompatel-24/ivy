# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: rome

builds:
  - id: rome
    main: ./cmd/rome
    binary: rome
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "946684800"
    ldflags:
      - -s -w -X github.com/ompatel-24/rome/internal/version.Value={{ .Version }}

archives:
  - id: release
    ids:
      - rome
    formats:
      - tar.gz
    name_template: rome_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 420
          mtime: "2000-01-01T00:00:00Z"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 420
          mtime: "2000-01-01T00:00:00Z"
    builds_info:
      owner: root
      group: root
      mode: 493
      mtime: "2000-01-01T00:00:00Z"

checksum:
  name_template: rome_{{ .Version }}_checksums.txt
  algorithm: sha256

snapshot:
  version_template: 0.0.0-snapshot

changelog:
  use: github-native

release:
  github:
    owner: ompatel-24
    name: rome
  name_template: Rome {{ .Tag }}
  draft: true
  prerelease: auto

brews:
  - name: rome
    ids:
      - release
    repository:
      owner: ompatel-24
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/ompatel-24/rome
    description: Take your terminal agents with you
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "rome"
    test: |
      assert_match version.to_s, shell_output("#{bin}/rome version")
