<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09110d" />
    <title>Ivy Terminal</title>
  </head>
  <body>
    <main id="app" class="app">
      <header class="session-header">
        <div class="brand" aria-label="Ivy">
          <span aria-hidden="true">🌿</span>
          <span>Ivy</span>
        </div>
        <div class="session-details">
          <strong id="command">Terminal</strong>
          <span id="directory"></span>
        </div>
        <div id="status" class="status status--connecting" role="status" aria-live="polite">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="status-label">Connecting</span>
        </div>
      </header>
      <section id="terminal" class="terminal" aria-label="Ivy terminal session"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
